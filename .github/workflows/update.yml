name: Auto Update Upstream

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update.yml
      - scripts/**
      - tests/**
  schedule:
    - cron: '47 */6 * * *' # Every 6 hours staggered (04:47, 10:47, 16:47, 22:47 UTC)
  workflow_dispatch:

concurrency:
  group: upstream-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Check & Update Google Releases
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NIXPKGS_ALLOW_UNFREE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable user namespaces for runtime sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install headless display test tools
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 xauth

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Run Updater Unit Tests
        run: python3 -m unittest discover -s tests -v

      - name: Run Update Script
        id: updater
        run: python3 scripts/update.py

      - name: Flake Check
        if: steps.updater.outputs.has_update == 'true'
        run: nix flake check --all-systems

      - name: Build and verify update if changed
        if: steps.updater.outputs.has_update == 'true'
        run: nix build .#default --impure --print-build-logs

      - name: Run Runtime Smoke Test
        if: steps.updater.outputs.has_update == 'true'
        run: xvfb-run -a dbus-run-session --config-file=tests/dbus-session.conf -- python3 scripts/check-smoke.py

      - name: Commit and Push Release
        if: steps.updater.outputs.has_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.updater.outputs.version }}
          BUILD: ${{ steps.updater.outputs.build }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkgs/antigravity-ide/sources.json
          git commit -m "chore(release): bump Antigravity IDE to ${VERSION}"
          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git tag -a "v${VERSION}" -m "Release Antigravity IDE v${VERSION} (build ${BUILD})"
          fi
          git push origin HEAD:refs/heads/main --tags

      - name: Create GitHub Release
        if: steps.updater.outputs.has_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.updater.outputs.version }}"
          name: "Antigravity IDE v${{ steps.updater.outputs.version }}"
          body: |
            Automated release tracking official Google Antigravity IDE edge release `${{ steps.updater.outputs.version }}` (build `${{ steps.updater.outputs.build }}`).
