name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Flake Check & Runtime Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NIXPKGS_ALLOW_UNFREE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable user namespaces for runtime sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install headless display test tools
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 xauth

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Check Nix Flake
        run: nix flake check --all-systems

      - name: Build Antigravity IDE Package
        run: nix build .#default --impure --print-build-logs

      - name: Run Runtime Smoke Test
        run: xvfb-run -a dbus-run-session --config-file=tests/dbus-session.conf -- python3 scripts/check-smoke.py
